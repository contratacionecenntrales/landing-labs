<style>
  :root{
    --bg:#0A0A0A;
    --cyan:#00F0FF;
    --ink:#F5F5F5;
    --ink-dim:#8A8A8A;
    --line:#1E1E1E;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 24px;
    background:
      radial-gradient(760px 420px at 50% 8%, rgba(0,240,255,0.08), transparent 65%),
      var(--bg);
    color:var(--ink);
    font-family:'Inter','Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    text-align:center;
  }
  .scanlines{
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:linear-gradient(rgba(0,240,255,0.028) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(0,240,255,0.028) 1px, transparent 1px);
    background-size:38px 38px;
    mask-image:radial-gradient(circle at 50% 30%, rgba(0,0,0,0.85), transparent 70%);
  }
  main{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    max-width:440px;
    width:100%;
  }
  .logo{
    width:64px;
    height:64px;
    margin-bottom:28px;
    filter:drop-shadow(0 0 18px rgba(0,240,255,0.35));
  }
  .logo path,.logo rect{fill:var(--cyan);}
  h1{
    margin:0 0 14px;
    font-family:'Plus Jakarta Sans','Inter',sans-serif;
    font-weight:800;
    font-size:clamp(24px,5vw,32px);
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink);
  }
  p.subtitle{
    margin:0 0 40px;
    font-size:14.5px;
    line-height:1.65;
    color:var(--ink-dim);
    max-width:340px;
  }
  a.cta{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:16px 40px;
    border-radius:2px;
    font-family:'Plus Jakarta Sans','Inter',sans-serif;
    font-size:13px;
    font-weight:700;
    letter-spacing:.12em;
    text-transform:uppercase;
    text-decoration:none;
    color:var(--bg);
    background:var(--cyan);
    box-shadow:0 0 0 1px rgba(0,240,255,0.4), 0 0 32px rgba(0,240,255,0.25);
    transition:box-shadow .2s ease, transform .2s ease, background .2s ease;
  }
  a.cta:hover{
    background:#33f3ff;
    box-shadow:0 0 0 1px rgba(0,240,255,0.6), 0 0 44px rgba(0,240,255,0.4);
    transform:translateY(-1px);
  }
  a.cta:active{transform:translateY(0);}

  .security-note{
    display:inline-flex;
    align-items:center;
    gap:7px;
    margin-top:34px;
    font-size:12px;
    color:var(--ink-dim);
  }
  .security-note svg{flex-shrink:0; opacity:.8;}

  footer{
    position:relative;
    z-index:1;
    margin-top:64px;
    font-size:10.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#4a4a4a;
  }

  @media (max-width:420px){
    a.cta{width:100%; justify-content:center;}
  }
</style>
